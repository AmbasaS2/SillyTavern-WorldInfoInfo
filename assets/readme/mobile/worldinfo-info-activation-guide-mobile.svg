<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1413" viewBox="0 0 960 1413" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" role="img" aria-label="WorldInfo Info / Why this lore?"><rect width="960" height="1413" fill="#f7f4f6"/><rect x="44" y="30" width="13" height="88" rx="6" fill="#a27a91"/><text x="74" y="61" font-size="36" fill="#40323c" font-weight="600">발동 설정과 실제 발동 이유는 다릅니다</text><text x="74" y="100" font-size="28" fill="#88667a" font-weight="400">WorldInfo Info: Insight · Why this lore?</text><rect x="44" y="145" width="872" height="288" rx="18" fill="#fff" stroke="#ddcfd7" stroke-width="2"/><text x="71" y="188" font-size="33" fill="#40323c" font-weight="600">01  목록의 발동 방식 아이콘</text><text x="71" y="223" font-size="30" fill="#a27a91" font-weight="600">01  The list icon</text><path d="M71 242H888" stroke="#ddcfd7" stroke-width="2"/><rect x="71" y="265" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="294" font-size="28" fill="#40323c" font-weight="600">설정상 벡터 로어</text><text x="89" y="324" font-size="26" fill="#88667a" font-weight="400">Configured: Vector</text><rect x="71" y="349" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="378" font-size="28" fill="#40323c" font-weight="600">저장된 활성화 설정을 나타냅니다.</text><text x="89" y="408" font-size="26" fill="#88667a" font-weight="400">This describes the saved strategy.</text><rect x="44" y="453" width="872" height="456" rx="18" fill="#fff" stroke="#ddcfd7" stroke-width="2"/><text x="71" y="496" font-size="33" fill="#40323c" font-weight="600">02  로어 열람창에서 이유 확인</text><text x="71" y="531" font-size="30" fill="#a27a91" font-weight="600">02  Open the lore reader</text><path d="M71 550H888" stroke="#ddcfd7" stroke-width="2"/><rect x="71" y="573" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="602" font-size="28" fill="#40323c" font-weight="600">실제 발동 이유: 키워드 일치</text><text x="89" y="632" font-size="26" fill="#88667a" font-weight="400">Actual cause: Keyword match</text><rect x="71" y="657" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="686" font-size="28" fill="#40323c" font-weight="600">예: observatory 키워드가 일치함</text><text x="89" y="716" font-size="26" fill="#88667a" font-weight="400">Example: “observatory”</text><rect x="71" y="741" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="770" font-size="28" fill="#40323c" font-weight="600">상시 주입 / Sticky 유지 / 외부 활성화 등</text><text x="89" y="800" font-size="26" fill="#88667a" font-weight="400">Other causes: Always-on / Sticky / External</text><rect x="71" y="825" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="854" font-size="28" fill="#40323c" font-weight="600">확인 불가: 근거가 충분하지 않음</text><text x="89" y="884" font-size="26" fill="#88667a" font-weight="400">Unknown: no confirmed cause</text><rect x="44" y="929" width="872" height="456" rx="18" fill="#fff" stroke="#ddcfd7" stroke-width="2"/><text x="71" y="972" font-size="33" fill="#40323c" font-weight="600">03  확인하는 도구이지 호출하는 도구가 아님</text><text x="71" y="1007" font-size="30" fill="#a27a91" font-weight="600">03  Inspect only</text><path d="M71 1026H888" stroke="#ddcfd7" stroke-width="2"/><rect x="71" y="1049" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="1078" font-size="28" fill="#40323c" font-weight="600">일반 RP 답변 기준 목록 갱신</text><text x="89" y="1108" font-size="26" fill="#88667a" font-weight="400">Normal visible RP updates the list</text><rect x="71" y="1133" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="1162" font-size="28" fill="#40323c" font-weight="600">미리보기·백그라운드 생성은 목록 유지</text><text x="89" y="1192" font-size="26" fill="#88667a" font-weight="400">Dry-run / quiet generation do not replace it</text><rect x="71" y="1217" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="1246" font-size="28" fill="#40323c" font-weight="600">열람창은 현재 로어를 읽음 · 과거 복제본 아님</text><text x="89" y="1276" font-size="26" fill="#88667a" font-weight="400">Reader: current entry, not historical copy</text><rect x="71" y="1301" width="817" height="70" rx="9" fill="#f7f4f6"/><text x="89" y="1330" font-size="28" fill="#40323c" font-weight="600">Jev 실제 발동 표시 · 호환 STLO 선택 연동</text><text x="89" y="1360" font-size="26" fill="#88667a" font-weight="400">Jev: confirmed activation (optional STLO)</text></svg>