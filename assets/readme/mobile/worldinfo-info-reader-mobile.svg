a" font-weight="400" text-anchor="start">A lantern lights the entrance.</text><text x="100" y="551" font-size="30" fill="#29343a" font-weight="400" text-anchor="start">A spiral stair leads to the roof.</text><rect x="28" y="655" width="704" height="490" rx="20" fill="#ffffff" stroke="#cdbdc7" stroke-width="2"/><text x="52" y="700" font-size="34" fill="#29343a" font-weight="700" text-anchor="start">02  저장된 번역문</text><text x="52" y="738" font-size="30" fill="#79586e" font-weight="600" text-anchor="start">Saved translation</text><rect x="52" y="765" width="656" height="350" rx="16" fill="#f6eff2" stroke="#cdbdc7" stroke-width="2"/><text x="76" y="812" font-size="35" fill="#29343a" font-weight="700" text-anchor="start">오래된 천문대</text><rect x="652" y="781" width="36" height="36" rx="8" fill="#ffffff" stroke="#cdbdc7" stroke-width="2"/><text x="670" y="808" font-size="28" fill="#29343a" font-weight="400" text-anchor="middle">×</text><circle cx="84" cy="842" r="8" fill="#65aa74"/><text x="104" y="852" font-size="29" fill="#79586e" font-weight="400" text-anchor="start">키워드 일치 · observatory</text><rect x="76" y="874" width="608" height="216" rx="10" fill="#fcf8f8" stroke="#cdbdc7" stroke-width="2"/><text x="100" y="915" font-size="31" fill="#29343a" font-weight="700" text-anchor="start">천문대의 구조</text><path d="M100 932H660" fill="none" stroke="#cdbdc7" stroke-width="2"/><text x="100" y="976" font-size="30" fill="#29343a" font-weight="400" text-anchor="start">도시 외곽의 오래된 천문대.</text><text x="100" y="1020" font-size="30" fill="#29343a" font-weight="400" text-anchor="start">입구에는 작은 등불이 켜져 있다.</text><text x="100" y="1064" font-size="30" fill="#29343a" font-weight="400" text-anchor="start">나선 계단은 옥상으로 이어진다.</text><rect x="28" y="1168" width="704" height="86" rx="12" fill="#f6eff2" stroke="#cdbdc7" stroke-width="2"/><text x="52" y="1203" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">One available version is displayed.</text><text x="52" y="1238" font-size="27" fill="#79586e" font-weight="400" text-anchor="start">열람창에는 사용 가능한 한 버전이 표시됩니다.</text><text x="30" y="1285" font-size="25" fill="#79586e" font-weight="400" text-anchor="start">Illustrated example · not a screenshot</text><text x="30" y="1320" font-size="25" fill="#79586e" font-weight="400" text-anchor="start">실제 캡처가 아닌 설명용 구성도</text></svg>
