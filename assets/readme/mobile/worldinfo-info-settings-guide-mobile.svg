<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1142" viewBox="0 0 960 1142" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info settings</title><desc id="desc">Illustrated settings menu, optional token total and library link.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1142" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="67" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="57" font-size="39" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info / Settings</text><text x="80" y="93" font-size="25" fill="#69737a" font-weight="400" text-anchor="start">우클릭 또는 길게 누르기 · 설정 메뉴</text><rect x="47" y="142" width="872" height="540" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="135" width="872" height="540" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="64" y="155" width="832" height="460" rx="14" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><rect x="91" y="184" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 195l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="200" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Group by lorebook</text><text x="130" y="224" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">로어북별로 묶기</text><rect x="91" y="244" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 255l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="260" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Show in injection order</text><text x="130" y="284" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">주입 순서대로 표시</text><rect x="91" y="304" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 315l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="320" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Show chat message positions</text><text x="130" y="344" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">대화 메시지 위치 표시</text><path d="M89 355L869 355" stroke="#bca9b4" stroke-width="1" fill="none"/><rect x="91" y="364" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="380" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Show injected lore token total</text><text x="130" y="404" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">주입 로어 토큰 합계 표시</text><rect x="91" y="424" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="440" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Link Lorebook Library</text><text x="130" y="464" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">로어북 서가 연동</text><rect x="91" y="484" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="500" font-size="22" fill="#29343a" font-weight="500" text-anchor="start">Allow dragging the book button</text><text x="130" y="524" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">책 버튼 드래그 허용</text><text x="91" y="584" font-size="21" fill="#29343a" font-weight="500" text-anchor="start">Reset book button position / 책 버튼 위치 초기화</text><text x="72" y="652" font-size="22" fill="#69737a" font-weight="400" text-anchor="start">Illustrated settings menu · 기본 설정 기준</text><rect x="47" y="712" width="872" height="186" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="705" width="872" height="186" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="747" font-size="28" fill="#29343a" font-weight="600" text-anchor="start">Optional token count</text><text x="72" y="786" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">답변 생성이 끝난 뒤 목록을 열면 한 번만 계산</text><rect x="72" y="810" width="816" height="55" rx="10" fill="#f6eff2" stroke="#bca9b4" stroke-width="1"/><text x="92" y="845" font-size="25" fill="#29343a" font-weight="600" text-anchor="start">Total  1,248</text><text x="866" y="845" font-size="20" fill="#69737a" font-weight="400" text-anchor="end">Example / 예시</text><rect x="47" y="928" width="872" height="190" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="921" width="872" height="190" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="964" font-size="28" fill="#29343a" font-weight="600" text-anchor="start">Optional Lorebook Library link</text><text x="72" y="1005" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">서가 연동을 켜면 로어북 이름 + UID로 항목 열기</text><text x="72" y="1044" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">연동 불가 또는 끔 → 기본 읽기 전용 열람창</text><text x="72" y="1080" font-size="22" fill="#a27a91" font-weight="600" text-anchor="start">Both options are off by default.</text></g></svg>