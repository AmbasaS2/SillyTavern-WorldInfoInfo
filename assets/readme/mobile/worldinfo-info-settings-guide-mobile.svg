<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1400" viewBox="0 0 960 1400" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info settings / 월드인포인포 설정</title><desc id="desc">Bilingual settings illustration including token counting and library integration.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1400" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="100" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="58" font-size="38" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info / Settings</text><text x="80" y="93" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">Right-click or long-press the floating book</text><text x="80" y="124" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">책 버튼 우클릭 또는 길게 누르기</text><rect x="47" y="163" width="872" height="565" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="156" width="872" height="565" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="64" y="176" width="832" height="462" rx="14" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><rect x="91" y="198" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 209l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="214" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Group by lorebook</text><text x="130" y="238" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">로어북별로 묶기</text><rect x="91" y="259" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 270l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="275" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Show in injection order</text><text x="130" y="299" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">주입 순서대로 표시</text><rect x="91" y="320" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 331l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="336" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Show chat message positions</text><text x="130" y="360" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">대화 메시지 위치 표시</text><rect x="91" y="381" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="397" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Show injected lore token total</text><text x="130" y="421" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">주입 로어 토큰 합계 표시</text><rect x="91" y="442" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="458" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Link Lorebook Library</text><text x="130" y="482" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">로어북 서가 연동</text><rect x="91" y="503" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="519" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Allow dragging the book button</text><text x="130" y="543" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">책 버튼 드래그 허용</text><path d="M89 562L869 562" stroke="#bca9b4" stroke-width="1" fill="none"/><text x="91" y="588" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">Reset book button position</text><text x="91" y="616" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">책 버튼 위치 초기화</text><text x="72" y="674" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Illustrated settings · defaults shown</text><text x="72" y="704" font-size="22" fill="#69737a" font-weight="400" text-anchor="start">설정 화면 구성 예시 · 기본 설정 기준</text><rect x="47" y="757" width="872" height="262" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="750" width="872" height="262" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="792" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">Optional token count</text><text x="72" y="825" font-size="24" fill="#a27a91" font-weight="600" text-anchor="start">선택형 토큰 합계</text><text x="72" y="861" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Count once when the list is open after the reply ends.</text><text x="72" y="895" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">답변 생성이 끝난 뒤 목록을 열면 한 번만 계산합니다.</text><rect x="72" y="920" width="816" height="62" rx="10" fill="#f6eff2" stroke="#bca9b4" stroke-width="1"/><text x="92" y="960" font-size="25" fill="#29343a" font-weight="600" text-anchor="start">Total  1,248</text><text x="866" y="960" font-size="20" fill="#69737a" font-weight="400" text-anchor="end">Example / 예시</text><rect x="47" y="1049" width="872" height="324" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="1042" width="872" height="324" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="1084" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">Optional Lorebook Library link</text><text x="72" y="1117" font-size="24" fill="#a27a91" font-weight="600" text-anchor="start">선택형 로어북 서가 연동</text><text x="72" y="1155" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Open the exact entry by lorebook name + UID.</text><text x="72" y="1188" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">로어북 이름 + UID로 해당 항목을 엽니다.</text><text x="72" y="1230" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Off or unavailable → built-in read-only reader</text><text x="72" y="1263" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">끄거나 연동할 수 없다면 기본 읽기 전용 열람창</text><text x="72" y="1309" font-size="22" fill="#a27a91" font-weight="600" text-anchor="start">Both options are off by default.</text><text x="72" y="1340" font-size="22" fill="#a27a91" font-weight="600" text-anchor="start">두 옵션 모두 기본값은 꺼짐입니다.</text></g></svg>