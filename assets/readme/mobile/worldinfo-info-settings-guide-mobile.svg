<svg xmlns="http://www.w3.org/2000/svg" width="960" height="751" viewBox="0 0 960 751" role="img" aria-labelledby="title desc"><title id="title">게으름뱅이가 읽는 월드인포인포 설정 / WorldInfo Info of Sloth settings</title><desc id="desc">설정 메뉴 / Settings menu</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="751" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="100" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="58" font-size="38" fill="#29343a" font-weight="600" text-anchor="start">설정 / Settings</text><text x="80" y="93" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">책 버튼 우클릭 또는 길게 누르기</text><text x="80" y="124" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">Right-click or long-press the floating book</text><rect x="47" y="163" width="872" height="571" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="156" width="872" height="571" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="64" y="176" width="832" height="523" rx="14" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><rect x="91" y="198" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 209l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="214" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">로어북별로 묶기</text><text x="130" y="238" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Group by lorebook</text><rect x="91" y="259" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 270l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="275" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">주입 순서대로 표시</text><text x="130" y="299" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Show in injection order</text><rect x="91" y="320" width="22" height="22" rx="4" fill="#a27a91" stroke="#a27a91" stroke-width="2"/><path d="M96 331l5 5 9 -11" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="336" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">대화 메시지 위치 표시</text><text x="130" y="360" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Show chat message positions</text><rect x="91" y="381" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="397" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">주입 로어 토큰 합계 표시</text><text x="130" y="421" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Show injected lore token total</text><g transform="translate(0 61)"><rect x="91" y="381" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="397" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">원문으로 보기</text><text x="130" y="421" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">View original text</text></g><g transform="translate(0 61)"><rect x="91" y="442" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="458" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">로어북 서가 연동</text><text x="130" y="482" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Link Lorebook Library</text><rect x="91" y="503" width="22" height="22" rx="4" fill="#fff" stroke="#a27a91" stroke-width="2"/><text x="130" y="519" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">책 버튼 드래그 허용</text><text x="130" y="543" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Allow dragging the book button</text><path d="M89 562L869 562" stroke="#bca9b4" stroke-width="1" fill="none"/><text x="91" y="588" font-size="23" fill="#29343a" font-weight="500" text-anchor="start">책 버튼 위치 초기화</text><text x="91" y="616" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Reset book button position</text></g></g></svg>
