<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1055" viewBox="0 0 960 1055" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info workflow</title><desc id="desc">Four steps to open the last injected lore and read saved translations.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1055" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="67" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="57" font-size="39" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info / How It Works</text><text x="80" y="93" font-size="25" fill="#69737a" font-weight="400" text-anchor="start">답변 생성 → 주입 목록 → 원하는 로어 열람</text><rect x="47" y="142" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="135" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="157" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="204" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">01</text><text x="160" y="181" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">Generate a reply</text><text x="160" y="216" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">답변 생성</text><path d="M160 240L870 240" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="277" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Use your normal SillyTavern chat</text><text x="160" y="312" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">평소처럼 RP를 진행합니다.</text><rect x="47" y="367" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="360" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="382" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="429" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">02</text><text x="160" y="406" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">Open the book</text><text x="160" y="441" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">책 버튼 누르기</text><path d="M160 465L870 465" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="502" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">See the latest injected lore list</text><text x="160" y="537" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">최근 주입된 로어 목록을 펼칩니다.</text><rect x="47" y="592" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="585" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="607" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="654" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">03</text><text x="160" y="631" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">Choose a lore entry</text><text x="160" y="666" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">로어 항목 선택</text><path d="M160 690L870 690" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="727" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Read the body and recorded activation cause</text><text x="160" y="762" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">본문과 기록된 발동 원인을 봅니다.</text><rect x="47" y="817" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="810" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="832" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="879" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">04</text><text x="160" y="856" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">Read saved translations</text><text x="160" y="891" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">저장된 번역문 확인</text><path d="M160 915L870 915" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="952" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Read existing translations when available</text><text x="160" y="987" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">유효한 번역이 있으면 번역문으로 열람합니다.</text></g></svg>