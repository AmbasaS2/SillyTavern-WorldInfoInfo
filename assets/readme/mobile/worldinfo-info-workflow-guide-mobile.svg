<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1065" viewBox="0 0 960 1065" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info: Insight workflow / 사용 흐름</title><desc id="desc">Four bilingual steps to read lore and saved translations.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1065" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="100" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="58" font-size="38" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info: Insight · How it works</text><text x="80" y="93" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">답변 생성 → 주입 목록 → 원하는 로어 열람</text><text x="80" y="124" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">Generate → open the list → read an entry</text><rect x="47" y="163" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="156" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="178" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="225" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">01</text><text x="160" y="202" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">답변 생성</text><text x="160" y="237" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">Generate a reply</text><path d="M160 261L870 261" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="298" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">일반 RP 답변을 생성합니다.</text><text x="160" y="333" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Generate a normal visible RP reply</text><rect x="47" y="388" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="381" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="403" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="450" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">02</text><text x="160" y="427" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">책 버튼 누르기</text><text x="160" y="462" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">Open the book</text><path d="M160 486L870 486" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="523" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">최근 RP의 로어 목록을 펼칩니다.</text><text x="160" y="558" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">See the latest tracked lore list</text><rect x="47" y="613" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="606" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="628" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="675" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">03</text><text x="160" y="652" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">로어 항목 선택</text><text x="160" y="687" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">Choose a lore entry</text><path d="M160 711L870 711" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="748" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">본문과 기록된 발동 원인을 봅니다.</text><text x="160" y="783" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Read the body and recorded activation cause</text><rect x="47" y="838" width="872" height="204" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="831" width="872" height="204" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="66" y="853" width="70" height="72" rx="17" fill="#a27a91" stroke="none" stroke-width="1"/><text x="101" y="900" font-size="29" fill="#fff" font-weight="600" text-anchor="middle">04</text><text x="160" y="877" font-size="30" fill="#29343a" font-weight="600" text-anchor="start">저장된 번역문 확인</text><text x="160" y="912" font-size="25" fill="#a27a91" font-weight="600" text-anchor="start">Read saved translations</text><path d="M160 936L870 936" stroke="#d5dadd" stroke-width="2" fill="none"/><text x="160" y="973" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">유효한 번역이 있으면 번역문으로 열람합니다.</text><text x="160" y="1008" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Read existing translations when available</text></g></svg>