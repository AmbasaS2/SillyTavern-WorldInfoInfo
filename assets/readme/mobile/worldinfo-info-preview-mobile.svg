<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1250" viewBox="0 0 960 1250" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info UI example</title><desc id="desc">An illustrated example of the injected lore list and read-only translated lore reader. Not a live screenshot.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1250" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="67" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="57" font-size="39" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info / Ambasa fork</text><text x="80" y="93" font-size="25" fill="#69737a" font-weight="400" text-anchor="start">주입된 로어 목록 · 읽기 전용 열람창</text><rect x="47" y="142" width="872" height="425" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="135" width="872" height="425" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="64" y="155" width="832" height="326" rx="14" fill="#f6eff2" stroke="#bca9b4" stroke-width="1.5"/><rect x="82" y="170" width="796" height="60" rx="10" fill="#eee2e8" stroke="none" stroke-width="1"/><text x="104" y="207" font-size="25" fill="#69737a" font-weight="600" text-anchor="start">SillyTavern / Example RP</text><rect x="100" y="250" width="367" height="98" rx="10" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="118" y="286" font-size="21" fill="#29343a" font-weight="400" text-anchor="start">“The observatory is still open.”</text><text x="118" y="319" font-size="19" fill="#69737a" font-weight="400" text-anchor="start">He gestured toward the stairs.</text><rect x="100" y="360" width="367" height="82" rx="10" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="118" y="394" font-size="21" fill="#29343a" font-weight="400" text-anchor="start">I followed the lantern light.</text><text x="118" y="422" font-size="17" fill="#69737a" font-weight="400" text-anchor="start">Example chat / 예시 대화</text><g transform="translate(109 410)"><rect x="0" y="0" width="50" height="57" rx="7" fill="#a27a91" stroke="none" stroke-width="1"/><rect x="7" y="3" width="37" height="46" rx="4" fill="#c8a9b8" stroke="none" stroke-width="1"/><path d="M10 49L40 49" stroke="#f8eef1" stroke-width="3" fill="none"/><circle cx="26" cy="24" r="12" fill="none" stroke="#fff" stroke-width="2"/><ellipse cx="26" cy="24" rx="5" ry="12" fill="none" stroke="#fff" stroke-width="2"/><path d="M14 24L38 24" stroke="#fff" stroke-width="2" fill="none"/><circle cx="48" cy="50" r="14" fill="#ee303c"/><text x="48" y="56" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">4</text></g><rect x="487" y="242" width="368" height="215" rx="12" fill="#f8f1f4" stroke="#bca9b4" stroke-width="2"/><text x="505" y="270" font-size="23" fill="#29343a" font-weight="700" text-anchor="start">Places</text><circle cx="523" cy="295" r="8" fill="#65aa74"/><text x="541" y="303" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">Old Observatory</text><circle cx="523" cy="327" r="8" fill="#719dd6"/><text x="541" y="335" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">City at Night</text><text x="505" y="364" font-size="23" fill="#29343a" font-weight="700" text-anchor="start">Characters</text><circle cx="523" cy="388" r="8" fill="#65aa74"/><text x="541" y="396" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">The Keeper</text><circle cx="523" cy="420" r="8" fill="#65aa74"/><text x="541" y="428" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">Lantern Guild</text><text x="72" y="521" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">01  Injected lore list</text><text x="72" y="548" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">책 버튼을 누르면 최근 주입된 항목이 나타납니다.</text><rect x="47" y="597" width="872" height="585" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="590" width="872" height="585" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><rect x="64" y="610" width="832" height="490" rx="14" fill="#e3d9df" stroke="#bca9b4" stroke-width="1.5"/><rect x="111" y="642" width="738" height="420" rx="13" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><text x="137" y="688" font-size="27" fill="#29343a" font-weight="600" text-anchor="start">오래된 천문대</text><rect x="792" y="658" width="38" height="38" rx="8" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="811" y="685" font-size="29" fill="#29343a" font-weight="400" text-anchor="middle">×</text><circle cx="146" cy="718" r="8" fill="#65aa74"/><text x="162" y="726" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">키워드 일치 · observatory</text><rect x="132" y="745" width="696" height="292" rx="10" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="152" y="786" font-size="25" fill="#29343a" font-weight="700" text-anchor="start">천문대의 구조</text><path d="M152 800L808 800" stroke="#bca9b4" stroke-width="2" fill="none"/><text x="152" y="839" font-size="23" fill="#29343a" font-weight="400" text-anchor="start">도시 외곽에 자리한 오래된 천문대입니다.</text><text x="152" y="873" font-size="23" fill="#29343a" font-weight="400" text-anchor="start">밤이면 작은 등불이 입구를 비춥니다.</text><text x="152" y="920" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">•  나선 계단은 옥상으로 이어집니다.</text><text x="152" y="954" font-size="22" fill="#29343a" font-weight="400" text-anchor="start">•  관리인이 망원경을 돌보고 있습니다.</text><text x="152" y="1005" font-size="20" fill="#a27a91" font-weight="600" text-anchor="start">예시로 저장된 번역문</text><text x="72" y="1139" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">02  Read-only lore reader</text><text x="72" y="1165" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">항목을 눌러 발동 원인과 본문을 확인합니다.</text><text x="44" y="1220" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Illustrated UI example · 실제 화면을 바탕으로 재구성한 예시</text></g></svg>