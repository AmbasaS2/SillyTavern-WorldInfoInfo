<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1390" viewBox="0 0 960 1390" role="img" aria-labelledby="title desc"><title id="title">WorldInfo Info bilingual UI examples / 월드인포인포 한영 UI 예시</title><desc id="desc">Illustrations of the list and alternative reader states; examples only.</desc><g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif"><rect x="0" y="0" width="960" height="1390" rx="0" fill="#f7f4f6" stroke="none" stroke-width="1"/><rect x="44" y="28" width="13" height="100" rx="6" fill="#a27a91" stroke="none" stroke-width="1"/><text x="80" y="58" font-size="38" fill="#29343a" font-weight="600" text-anchor="start">WorldInfo Info / Ambasa fork</text><text x="80" y="93" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">Injected lore list · Read-only lore reader</text><text x="80" y="124" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">주입된 로어 목록 · 읽기 전용 열람창</text><rect x="47" y="163" width="872" height="538" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="156" width="872" height="538" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="198" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">01  Open the floating book</text><text x="72" y="231" font-size="24" fill="#a27a91" font-weight="600" text-anchor="start">01  책 버튼으로 주입 목록 열기</text><rect x="72" y="251" width="816" height="322" rx="12" fill="#f6eff2" stroke="#bca9b4" stroke-width="1.5"/><rect x="90" y="270" width="780" height="46" rx="8" fill="#eee2e8" stroke="none" stroke-width="1"/><text x="108" y="301" font-size="23" fill="#69737a" font-weight="600" text-anchor="start">SillyTavern / Example RP · 예시 RP</text><rect x="104" y="340" width="333" height="57" rx="8" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><rect x="123" y="357" width="264" height="7" rx="3" fill="#d8cad2" stroke="none" stroke-width="1"/><rect x="123" y="372" width="200" height="7" rx="3" fill="#e5dce1" stroke="none" stroke-width="1"/><rect x="104" y="411" width="280" height="57" rx="8" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><rect x="123" y="428" width="213" height="7" rx="3" fill="#d8cad2" stroke="none" stroke-width="1"/><rect x="123" y="443" width="150" height="7" rx="3" fill="#e5dce1" stroke="none" stroke-width="1"/><g transform="translate(113 491)"><rect x="0" y="0" width="50" height="57" rx="7" fill="#a27a91" stroke="none" stroke-width="1"/><rect x="7" y="3" width="37" height="46" rx="4" fill="#c8a9b8" stroke="none" stroke-width="1"/><path d="M10 49L40 49" stroke="#f8eef1" stroke-width="3" fill="none"/><circle cx="26" cy="24" r="12" fill="none" stroke="#fff" stroke-width="2"/><ellipse cx="26" cy="24" rx="5" ry="12" fill="none" stroke="#fff" stroke-width="2"/><path d="M14 24L38 24" stroke="#fff" stroke-width="2" fill="none"/><circle cx="48" cy="50" r="14" fill="#ee303c"/><text x="48" y="56" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">4</text></g><rect x="454" y="330" width="399" height="222" rx="12" fill="#fcf8f8" stroke="#bca9b4" stroke-width="2"/><text x="473" y="359" font-size="21" fill="#29343a" font-weight="700" text-anchor="start">Places / 장소</text><circle cx="481" cy="381" r="7" fill="#65aa74"/><text x="497" y="388" font-size="19" fill="#29343a" font-weight="400" text-anchor="start">Old Observatory / 오래된 천문대</text><circle cx="481" cy="414" r="7" fill="#719dd6"/><text x="497" y="421" font-size="19" fill="#29343a" font-weight="400" text-anchor="start">City at Night / 밤의 도시</text><text x="473" y="453" font-size="21" fill="#29343a" font-weight="700" text-anchor="start">Characters / 인물</text><circle cx="481" cy="475" r="7" fill="#65aa74"/><text x="497" y="482" font-size="19" fill="#29343a" font-weight="400" text-anchor="start">The Keeper / 관리인</text><circle cx="481" cy="508" r="7" fill="#65aa74"/><text x="497" y="515" font-size="19" fill="#29343a" font-weight="400" text-anchor="start">Lantern Guild / 등불 길드</text><text x="72" y="614" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">See the latest injected entries at a glance.</text><text x="72" y="648" font-size="24" fill="#69737a" font-weight="400" text-anchor="start">최근 주입된 항목을 한눈에 확인합니다.</text><rect x="47" y="731" width="872" height="550" rx="22" fill="#e4dfe2" stroke="none" stroke-width="1"/><rect x="44" y="724" width="872" height="550" rx="22" fill="#ffffff" stroke="#d5dadd" stroke-width="2"/><text x="72" y="766" font-size="29" fill="#29343a" font-weight="600" text-anchor="start">02  Read the selected lore</text><text x="72" y="799" font-size="24" fill="#a27a91" font-weight="600" text-anchor="start">02  원하는 로어의 본문 읽기</text><text x="72" y="833" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">Example reader states: source or saved translation</text><text x="72" y="866" font-size="23" fill="#69737a" font-weight="400" text-anchor="start">열람창 예시: 원문 또는 저장된 번역문</text><rect x="72" y="892" width="399" height="282" rx="12" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><text x="89" y="923" font-size="22" fill="#29343a" font-weight="600" text-anchor="start">Old Observatory</text><rect x="426" y="905" width="28" height="28" rx="6" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="440" y="926" font-size="23" fill="#29343a" font-weight="400" text-anchor="middle">×</text><circle cx="97" cy="950" r="7" fill="#65aa74"/><text x="113" y="956" font-size="17" fill="#69737a" font-weight="400" text-anchor="start">Keyword match · observatory</text><rect x="86" y="971" width="371" height="187" rx="9" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="101" y="1004" font-size="21" fill="#29343a" font-weight="700" text-anchor="start">Observatory layout</text><path d="M101 1015L440 1015" stroke="#bca9b4" stroke-width="2" fill="none"/><text x="101" y="1052" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">An old observatory outside town.</text><text x="101" y="1087" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">A lantern lights the entrance.</text><text x="101" y="1122" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">• A spiral stair leads to the roof.</text><rect x="489" y="892" width="399" height="282" rx="12" fill="#f6eff2" stroke="#bca9b4" stroke-width="2"/><text x="506" y="923" font-size="22" fill="#29343a" font-weight="600" text-anchor="start">오래된 천문대</text><rect x="843" y="905" width="28" height="28" rx="6" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="857" y="926" font-size="23" fill="#29343a" font-weight="400" text-anchor="middle">×</text><circle cx="514" cy="950" r="7" fill="#65aa74"/><text x="530" y="956" font-size="17" fill="#69737a" font-weight="400" text-anchor="start">키워드 일치 · observatory</text><rect x="503" y="971" width="371" height="187" rx="9" fill="#fcf8f8" stroke="#bca9b4" stroke-width="1"/><text x="518" y="1004" font-size="21" fill="#29343a" font-weight="700" text-anchor="start">천문대의 구조</text><path d="M518 1015L857 1015" stroke="#bca9b4" stroke-width="2" fill="none"/><text x="518" y="1052" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">도시 외곽의 오래된 천문대.</text><text x="518" y="1087" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">입구에는 작은 등불이 켜져 있다.</text><text x="518" y="1122" font-size="18" fill="#29343a" font-weight="400" text-anchor="start">• 나선 계단은 옥상으로 이어진다.</text><text x="72" y="1210" font-size="21" fill="#a27a91" font-weight="600" text-anchor="start">Original text / 원문</text><text x="489" y="1210" font-size="21" fill="#a27a91" font-weight="600" text-anchor="start">Saved translation / 저장된 번역문</text><text x="72" y="1249" font-size="18" fill="#69737a" font-weight="400" text-anchor="start">The reader shows one available version. / 열람창에는 사용 가능한 한 버전이 표시됩니다.</text><text x="44" y="1326" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">Illustrated UI examples · not live screenshots</text><text x="44" y="1358" font-size="21" fill="#69737a" font-weight="400" text-anchor="start">UI 구성 예시 · 실기기 캡처 아님 (설명을 위해 한영 병기)</text></g></svg>