name: WorldInfo Info lore library integration
on:
  pull_request:
  push:
    branches: ['feat/lore-library-link-20261123']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs